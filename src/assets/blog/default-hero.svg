<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F7FB"/>
      <stop offset="0.55" stop-color="#EAF1F9"/>
      <stop offset="1" stop-color="#DDE9F6"/>
    </linearGradient>
    <linearGradient id="crystalA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A93CE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2E6EB4" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="crystalB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C8DBEF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5A93CE" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="crystalC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E6EB4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2E6EB4" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="720" fill="url(#paper)"/>

  <!-- faint large diamonds, background depth -->
  <g transform="translate(1180 360) rotate(45)">
    <rect x="-260" y="-260" width="520" height="520" fill="url(#crystalC)"/>
  </g>
  <g transform="translate(420 520) rotate(45)">
    <rect x="-170" y="-170" width="340" height="340" fill="url(#crystalC)"/>
  </g>
  <g transform="translate(240 140) rotate(45)">
    <rect x="-110" y="-110" width="220" height="220" fill="url(#crystalC)"/>
  </g>

  <!-- crystal cluster -->
  <g transform="translate(1180 360) rotate(45)">
    <rect x="-150" y="-150" width="300" height="300" fill="url(#crystalB)"/>
  </g>
  <g transform="translate(1180 360) rotate(45)">
    <rect x="-92" y="-92" width="184" height="184" fill="url(#crystalA)"/>
  </g>
  <g transform="translate(950 250) rotate(45)">
    <rect x="-46" y="-46" width="92" height="92" fill="url(#crystalB)"/>
  </g>
  <g transform="translate(1390 520) rotate(45)">
    <rect x="-34" y="-34" width="68" height="68" fill="url(#crystalA)"/>
  </g>
  <g transform="translate(880 470) rotate(45)">
    <rect x="-20" y="-20" width="40" height="40" fill="#2E6EB4" opacity="0.6"/>
  </g>
  <g transform="translate(1050 580) rotate(45)">
    <rect x="-12" y="-12" width="24" height="24" fill="#2E6EB4" opacity="0.45"/>
  </g>

  <!-- hairlines -->
  <line x1="120" y1="360" x2="700" y2="360" stroke="#2E6EB4" stroke-opacity="0.35" stroke-width="1"/>
  <g transform="translate(730 360) rotate(45)">
    <rect x="-7" y="-7" width="14" height="14" fill="#2E6EB4" opacity="0.8"/>
  </g>
</svg>
